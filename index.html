<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIN-4066 Feuerwehrschild Generator</title>

    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #f3f4f6;
      }

      [v-cloak] {
        display: none;
      }

      .page {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 24px;
        padding: 24px;
        background: #f3f4f6;
        color: #111827;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .controls {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 21px;
        line-height: 1.2;
      }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font-weight: 650;
        font-size: 14px;
      }

      textarea,
      select {
        width: 100%;
        min-width: 0;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 9px 11px;
        font: inherit;
        background: white;
      }

      textarea {
        resize: none;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 16px;
        font-weight: 750;
        cursor: pointer;
        background: #111827;
        color: white;
        white-space: nowrap;
      }

      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .filename {
        margin: 13px 0 0;
        font-size: 13px;
        color: #374151;
        word-break: break-word;
      }

      .note {
        margin: 14px 0 0;
        font-size: 13px;
        line-height: 1.4;
        color: #4b5563;
      }

      .preview {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .sign-preview {
        line-height: 0;
        max-width: 100%;
        max-height: calc(100vh - 48px);
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.16));
      }

      .sign-preview svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      @media (max-width: 760px) {
        .page {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
          gap: 16px;
          padding: 16px;
        }

        .controls {
          padding: 16px;
        }

        h1 {
          font-size: 18px;
          margin-bottom: 12px;
        }

        label {
          margin-bottom: 9px;
        }

        textarea,
        select {
          padding: 8px 10px;
        }

        .note {
          display: none;
        }

        .sign-preview {
          max-height: calc(100vh - 360px);
        }
      }
    </style>
  </head>

  <body>
    <div id="app" v-cloak>
      <main class="page">
        <section class="controls">
          <h1>DIN-4066 Feuerwehrschild Generator</h1>

          <label>
            Format
            <select v-model="selectedSignSizeKey">
              <option
                v-for="(signSize, signSizeKey) in signSizes"
                :key="signSizeKey"
                :value="signSizeKey"
              >
                {{ signSize.label }}
              </option>
            </select>
          </label>

          <label>
            Haupttext
            <textarea
              v-model="signText"
              rows="3"
              placeholder="z. B. FEUERWEHRZUFAHRT"
            ></textarea>
          </label>

          <label>
            Zusatztext optional
            <textarea
              v-model="secondarySignText"
              rows="2"
              placeholder="z. B. Stadt Musterstadt"
            ></textarea>
          </label>

          <label>
            PNG-Auflösung
            <select v-model="pngScaleFactor">
              <option :value="2">2×</option>
              <option :value="4">4×</option>
              <option :value="6">6×</option>
              <option :value="8">8×</option>
            </select>
          </label>

          <div class="buttons">
            <button type="button" @click="savePngFile">PNG speichern</button>

            <button type="button" class="secondary" @click="saveSvgFile">
              SVG speichern
            </button>
          </div>

          <p class="filename">
            Dateiname: <strong>{{ pngFilename }}</strong>
          </p>

          <p class="note">
            Hinweis: Das Layout ist maßstäblich und DIN-4066-nah umgesetzt.
            Für rechtsverbindliche Kennzeichnung bitte mit Brandschutzdienststelle
            oder zuständiger Stelle abstimmen.
          </p>
        </section>

        <section class="preview">
          <div
            class="sign-preview"
            :style="signPreviewStyle"
            v-html="svgMarkup"
          ></div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script>
      const { createApp, computed, ref } = Vue;

      createApp({
        setup() {
          const SIGN_RED = "#e30613";
          const SIGN_WHITE = "#ffffff";
          const SIGN_BLACK = "#000000";

          const DEFAULT_SIGN_TEXT = "FEUERWEHRZUFAHRT";
          const DEFAULT_SIGN_SIZE_KEY = "594x210";
          const DEFAULT_PNG_SCALE = 4;

          const BORDER_TO_HEIGHT_RATIO = 15 / 210;
          const MAIN_FONT_TO_HEIGHT_RATIO = 48 / 210;
          const MIN_MAIN_FONT_TO_HEIGHT_RATIO = 0.11;
          const SUB_FONT_TO_HEIGHT_RATIO = 22 / 210;

          const MAIN_TEXT_WIDTH_FACTOR = 0.78;
          const APPROXIMATE_CHARACTER_WIDTH_FACTOR = 0.62;
          const MULTILINE_MAIN_TEXT_FACTOR = 0.82;

          const MAIN_LINE_HEIGHT_FACTOR = 1.12;
          const SUB_LINE_HEIGHT_FACTOR = 1.18;
          const MAIN_TEXT_BASELINE_FACTOR = 0.85;
          const MAIN_TO_SUB_SPACING_FACTOR = 0.08;

          const signText = ref(DEFAULT_SIGN_TEXT);
          const secondarySignText = ref("");
          const selectedSignSizeKey = ref(DEFAULT_SIGN_SIZE_KEY);
          const pngScaleFactor = ref(DEFAULT_PNG_SCALE);

          const signSizes = Object.freeze({
            "297x105": {
              widthMillimeters: 297,
              heightMillimeters: 105,
              label: "297 × 105 mm",
            },
            "420x148": {
              widthMillimeters: 420,
              heightMillimeters: 148,
              label: "420 × 148 mm",
            },
            "594x210": {
              widthMillimeters: 594,
              heightMillimeters: 210,
              label: "594 × 210 mm",
            },
          });

          const selectedSignSize = computed(
            () => signSizes[selectedSignSizeKey.value],
          );

          const signAspectRatio = computed(
            () =>
              selectedSignSize.value.widthMillimeters /
              selectedSignSize.value.heightMillimeters,
          );

          const signPreviewStyle = computed(() => ({
            aspectRatio: String(signAspectRatio.value),
            width: `min(100%, calc((100vh - 48px) * ${signAspectRatio.value}))`,
          }));

          const signBorderWidth = computed(
            () =>
              selectedSignSize.value.heightMillimeters * BORDER_TO_HEIGHT_RATIO,
          );

          const mainTextLines = computed(() =>
            splitTextIntoTrimmedLines(signText.value.toUpperCase()),
          );

          const secondaryTextLines = computed(() =>
            splitTextIntoTrimmedLines(secondarySignText.value),
          );

          const allTextLinesForFilename = computed(() => [
            ...mainTextLines.value,
            ...secondaryTextLines.value,
          ]);

          const filenameBase = computed(() => {
            const rawFilenameText = allTextLinesForFilename.value.join(" ");
            return createSafeFilenameBase(rawFilenameText) || "feuerwehrschild";
          });

          const pngFilename = computed(
            () => `feuerwehrschild-${filenameBase.value}.png`,
          );

          const svgFilename = computed(
            () => `feuerwehrschild-${filenameBase.value}.svg`,
          );

          const mainFontSize = computed(() => {
            const { widthMillimeters, heightMillimeters } =
              selectedSignSize.value;

            const baseFontSize =
              heightMillimeters * MAIN_FONT_TO_HEIGHT_RATIO;

            const longestLineLength = Math.max(
              ...mainTextLines.value.map((line) => line.length),
              1,
            );

            const availableTextWidth =
              widthMillimeters * MAIN_TEXT_WIDTH_FACTOR;

            const estimatedTextWidth =
              longestLineLength *
              baseFontSize *
              APPROXIMATE_CHARACTER_WIDTH_FACTOR;

            const widthScalingFactor = Math.min(
              1,
              availableTextWidth / estimatedTextWidth,
            );

            const multilineScalingFactor =
              mainTextLines.value.length > 1 ? MULTILINE_MAIN_TEXT_FACTOR : 1;

            const calculatedFontSize =
              baseFontSize * widthScalingFactor * multilineScalingFactor;

            const minimumFontSize =
              heightMillimeters * MIN_MAIN_FONT_TO_HEIGHT_RATIO;

            return Math.max(minimumFontSize, calculatedFontSize);
          });

          const secondaryFontSize = computed(
            () =>
              selectedSignSize.value.heightMillimeters *
              SUB_FONT_TO_HEIGHT_RATIO,
          );

          const svgMarkup = computed(() => {
            const { widthMillimeters, heightMillimeters } =
              selectedSignSize.value;

            const innerRectangleX = signBorderWidth.value;
            const innerRectangleY = signBorderWidth.value;
            const innerRectangleWidth =
              widthMillimeters - signBorderWidth.value * 2;
            const innerRectangleHeight =
              heightMillimeters - signBorderWidth.value * 2;

            const mainLineHeight =
              mainFontSize.value * MAIN_LINE_HEIGHT_FACTOR;

            const secondaryLineHeight =
              secondaryFontSize.value * SUB_LINE_HEIGHT_FACTOR;

            const spacingBetweenMainAndSecondaryText =
              secondaryTextLines.value.length > 0
                ? heightMillimeters * MAIN_TO_SUB_SPACING_FACTOR
                : 0;

            const totalTextBlockHeight =
              mainTextLines.value.length * mainLineHeight +
              spacingBetweenMainAndSecondaryText +
              secondaryTextLines.value.length * secondaryLineHeight;

            let currentTextBaselineY =
              heightMillimeters / 2 -
              totalTextBlockHeight / 2 +
              mainFontSize.value * MAIN_TEXT_BASELINE_FACTOR;

            const mainTextSvgElements = mainTextLines.value
              .map((line) => {
                const textElement = createSvgTextElement({
                  text: line,
                  x: widthMillimeters / 2,
                  y: currentTextBaselineY,
                  fontSize: mainFontSize.value,
                  fontWeight: 700,
                  letterSpacing: mainFontSize.value * 0.025,
                });

                currentTextBaselineY += mainLineHeight;
                return textElement;
              })
              .join("");

            if (secondaryTextLines.value.length > 0) {
              currentTextBaselineY += spacingBetweenMainAndSecondaryText;
            }

            const secondaryTextSvgElements = secondaryTextLines.value
              .map((line) => {
                const textElement = createSvgTextElement({
                  text: line,
                  x: widthMillimeters / 2,
                  y: currentTextBaselineY,
                  fontSize: secondaryFontSize.value,
                  fontWeight: 600,
                  letterSpacing: secondaryFontSize.value * 0.015,
                });

                currentTextBaselineY += secondaryLineHeight;
                return textElement;
              })
              .join("");

            return `
<svg xmlns="http://www.w3.org/2000/svg"
  width="${widthMillimeters}mm"
  height="${heightMillimeters}mm"
  viewBox="0 0 ${widthMillimeters} ${heightMillimeters}">
  <rect
    x="0"
    y="0"
    width="${widthMillimeters}"
    height="${heightMillimeters}"
    fill="${SIGN_RED}"
  />
  <rect
    x="${innerRectangleX}"
    y="${innerRectangleY}"
    width="${innerRectangleWidth}"
    height="${innerRectangleHeight}"
    fill="${SIGN_WHITE}"
  />
  ${mainTextSvgElements}
  ${secondaryTextSvgElements}
</svg>`.trim();
          });

          function splitTextIntoTrimmedLines(value) {
            return value
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);
          }

          function createSvgTextElement({
            text,
            x,
            y,
            fontSize,
            fontWeight,
            letterSpacing,
          }) {
            return `<text
    x="${x}"
    y="${y}"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="${fontSize}"
    font-weight="${fontWeight}"
    letter-spacing="${letterSpacing}"
    fill="${SIGN_BLACK}"
  >${escapeXml(text)}</text>`;
          }

          function escapeXml(value) {
            return value
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function createSafeFilenameBase(value) {
            return value
              .replace(/Ä/g, "AE")
              .replace(/Ö/g, "OE")
              .replace(/Ü/g, "UE")
              .replace(/ä/g, "ae")
              .replace(/ö/g, "oe")
              .replace(/ü/g, "ue")
              .replace(/ß/g, "ss")
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/[^a-zA-Z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .toLowerCase();
          }

          async function savePngFile() {
            const pngBlob = await createPngBlobFromSvg();

            if (!pngBlob) {
              alert("PNG konnte nicht erzeugt werden.");
              return;
            }

            if (isFileSystemAccessApiAvailable()) {
              await saveBlobWithNativeFilePicker({
                blob: pngBlob,
                filename: pngFilename.value,
                mimeType: "image/png",
                fileExtension: ".png",
                description: "PNG image",
              });

              return;
            }

            saveBlobWithDownloadLink({
              blob: pngBlob,
              filename: pngFilename.value,
            });
          }

          async function createPngBlobFromSvg() {
            const { widthMillimeters, heightMillimeters } =
              selectedSignSize.value;

            const scaleFactor =
              Number(pngScaleFactor.value) || DEFAULT_PNG_SCALE;

            const svgBlob = new Blob([svgMarkup.value], {
              type: "image/svg+xml;charset=utf-8",
            });

            const svgObjectUrl = URL.createObjectURL(svgBlob);
            const imageElement = new Image();

            try {
              await loadImageFromUrl(imageElement, svgObjectUrl);

              const canvasElement = document.createElement("canvas");
              canvasElement.width = Math.round(widthMillimeters * scaleFactor);
              canvasElement.height = Math.round(
                heightMillimeters * scaleFactor,
              );

              const canvasContext = canvasElement.getContext("2d");

              if (!canvasContext) {
                return null;
              }

              canvasContext.drawImage(
                imageElement,
                0,
                0,
                canvasElement.width,
                canvasElement.height,
              );

              return await createBlobFromCanvas(canvasElement, "image/png");
            } finally {
              URL.revokeObjectURL(svgObjectUrl);
            }
          }

          function loadImageFromUrl(imageElement, imageUrl) {
            return new Promise((resolve, reject) => {
              imageElement.onload = resolve;
              imageElement.onerror = reject;
              imageElement.src = imageUrl;
            });
          }

          function createBlobFromCanvas(canvasElement, mimeType) {
            return new Promise((resolve) => {
              canvasElement.toBlob((createdBlob) => {
                resolve(createdBlob);
              }, mimeType);
            });
          }

          async function saveSvgFile() {
            const svgBlob = new Blob([svgMarkup.value], {
              type: "image/svg+xml;charset=utf-8",
            });

            if (isFileSystemAccessApiAvailable()) {
              await saveBlobWithNativeFilePicker({
                blob: svgBlob,
                filename: svgFilename.value,
                mimeType: "image/svg+xml",
                fileExtension: ".svg",
                description: "SVG image",
              });

              return;
            }

            saveBlobWithDownloadLink({
              blob: svgBlob,
              filename: svgFilename.value,
            });
          }

          function isFileSystemAccessApiAvailable() {
            return "showSaveFilePicker" in window;
          }

          async function saveBlobWithNativeFilePicker({
            blob,
            filename,
            mimeType,
            fileExtension,
            description,
          }) {
            try {
              const fileHandle = await window.showSaveFilePicker({
                suggestedName: filename,
                types: [
                  {
                    description,
                    accept: {
                      [mimeType]: [fileExtension],
                    },
                  },
                ],
              });

              const writableFileStream = await fileHandle.createWritable();

              await writableFileStream.write(blob);
              await writableFileStream.close();
            } catch (error) {
              if (error?.name === "AbortError") {
                return;
              }

              console.error(error);
              alert("Speichern über den Dateidialog wurde blockiert.");
            }
          }

          function saveBlobWithDownloadLink({ blob, filename }) {
            const objectUrl = URL.createObjectURL(blob);
            const downloadLinkElement = document.createElement("a");

            downloadLinkElement.href = objectUrl;
            downloadLinkElement.download = filename;
            downloadLinkElement.style.display = "none";

            document.body.appendChild(downloadLinkElement);
            downloadLinkElement.click();
            document.body.removeChild(downloadLinkElement);

            window.setTimeout(() => {
              URL.revokeObjectURL(objectUrl);
            }, 1000);
          }

          return {
            signText,
            secondarySignText,
            selectedSignSizeKey,
            pngScaleFactor,
            signSizes,
            signPreviewStyle,
            svgMarkup,
            pngFilename,
            savePngFile,
            saveSvgFile,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
